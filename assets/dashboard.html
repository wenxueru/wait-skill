<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="page.title">Wait dashboard</title>
<style>
:root {
  color-scheme: light;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --page: #f6f7f5; --surface: #fff; --surface-raised: #fcfdfb; --text: #263b35;
  --muted: #78877d; --soft-text: #819087; --border: #dce3dd; --border-soft: #edf0e9;
  --hover: #f0f4ef; --primary: #285e4c; --primary-hover: #204c3d; --primary-text: #fff;
  --badge: #edf3ec; --badge-text: #47705a; --track: #e5ebe3; --input-border: #dfe6da;
  --grid: #dfe6dc; --node: #fff; --node-selected: #edf5ec; --node-border: #d1ded4;
  --node-selected-border: #184f43; --edge: #a8b9ac; --focus: #50927a;
  --status-pending: #7e9588; --status-running: #4683c4; --status-waiting: #bc8d34;
  --status-completed: #2d8a60; --status-failed: #c7645d;
  --notice-bg: #f0f5e9; --notice-text: #5f7953; --notice-border: #92af87;
  --error-bg: #fff6f2; --error-text: #a5584b; --error-border: #f0d9d2;
  color: var(--text); background: var(--page);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --page: #151916; --surface: #1d231f; --surface-raised: #202722; --text: #e5ece7;
  --muted: #a0aca3; --soft-text: #92a097; --border: #354139; --border-soft: #2b342e;
  --hover: #29332d; --primary: #7ab498; --primary-hover: #8dc6a7; --primary-text: #142019;
  --badge: #283b30; --badge-text: #a6d0b5; --track: #303a33; --input-border: #3c4940;
  --grid: #38433c; --node: #202722; --node-selected: #23372b; --node-border: #465449;
  --node-selected-border: #84b89a; --edge: #62756a; --focus: #8fc5a8;
  --status-pending: #a4b5a9; --status-running: #7db4ee; --status-waiting: #e7bb68;
  --status-completed: #76c99b; --status-failed: #e4877f;
  --notice-bg: #263528; --notice-text: #bdd3af; --notice-border: #789269;
  --error-bg: #3b2925; --error-text: #f0a094; --error-border: #75443c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); }
button, input, textarea, select { font: inherit; color: inherit; }
button, select, summary { cursor: pointer; }
button { padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); transition: background .15s, border-color .15s; }
button:hover { background: var(--hover); border-color: var(--focus); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
[hidden] { display: none !important; }
.primary { color: var(--primary-text); background: var(--primary); border-color: var(--primary); }
.primary:hover { color: var(--primary-text); background: var(--primary-hover); }
.danger { color: #c46f66; border-color: transparent; background: transparent; }
header { height: 58px; padding: 0 28px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
h1 { font-size: 18px; letter-spacing: -.5px; margin: 0; }
h1 small { margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--border); font-size: 12px; font-weight: 400; letter-spacing: .5px; color: var(--soft-text); }
#scopeSwitch { color: var(--soft-text); font-size: 11px; text-decoration: none; cursor: pointer; }
.header-controls { display: flex; gap: 6px; margin-left: auto; }
.header-controls button { padding: 5px 8px; font-size: 11px; }
header #connection { font-size: 11px; color: var(--primary); }
main { max-width: 1600px; padding: 24px 28px; margin: auto; }
.toolbar { display: flex; align-items: center; gap: 7px; margin-bottom: 17px; }
.toolbar .spacer { flex: 1; }
select { max-width: 520px; padding: 7px 28px 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
#goals { max-width: min(60vw, 520px); font-weight: 500; }
.goal-heading { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -.4px; margin: 0; }
.stats { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; }
.badge { display: inline-block; padding: 4px 9px; border-radius: 5px; background: var(--badge); color: var(--badge-text); font-size: 11px; }
.progress { height: 3px; background: var(--track); border-radius: 3px; margin: -5px 0 21px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--primary); transition: width .3s; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: stretch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 17px; overflow: hidden; }
.graph-card { padding: 0; }
.graph-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 17px; border-bottom: 1px solid var(--border-soft); }
.graph-head b { font-weight: 550; font-size: 12px; }
.graph { overflow: auto; min-height: 290px; background: radial-gradient(var(--grid) .7px, transparent .7px); background-size: 18px 18px; }
svg { display: block; min-width: 100%; }
svg g { cursor: pointer; outline: none; }
svg g:hover rect:first-child, svg g:focus-visible rect:first-child { stroke: var(--focus); }
svg text { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--text); }
svg .small { font-size: 10px; fill: var(--soft-text); }
.legend { display: flex; gap: 12px; color: var(--soft-text); font-size: 10px; padding: 10px 17px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; }
.dot.pending { background: var(--status-pending); } .dot.running { background: var(--status-running); }
.dot.waiting { background: var(--status-waiting); } .dot.completed { background: var(--status-completed); }
.dot.failed { background: var(--status-failed); }
.details { min-height: 340px; }
.details h3 { font-size: 16px; font-weight: 550; margin: 12px 0 5px; line-height: 1.5; }
.details p { line-height: 1.65; }
.details ul { padding-left: 17px; line-height: 1.8; }
.details h4 { font-size: 12px; font-weight: 550; margin-bottom: 8px; }
.details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px system-ui; line-height: 1.7; background: var(--surface-raised); padding: 10px; border-radius: 6px; }
.detail-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 270px; color: var(--muted); text-align: center; }
.detail-placeholder .symbol { font-size: 28px; color: var(--soft-text); font-weight: 200; margin-bottom: 10px; }
.detail-placeholder p { margin: 0; font-size: 12px; }
.muted { color: var(--muted); font-size: 11px; }
label { display: block; font-size: 11px; color: var(--soft-text); margin-top: 14px; }
input, textarea { display: block; width: 100%; padding: 8px 9px; border: 1px solid var(--input-border); border-radius: 6px; margin-top: 6px; background: var(--surface-raised); }
textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.events { margin-top: 16px; padding: 0; }
.events summary { padding: 13px 17px; font-size: 12px; color: var(--soft-text); }
.events summary::marker { color: var(--muted); }
#events { padding: 0 17px 9px; max-height: 240px; overflow: auto; }
.event { display: flex; gap: 20px; padding: 9px 0; border-top: 1px solid var(--border-soft); font-size: 11px; }
.event time { color: var(--muted); min-width: 125px; font-variant-numeric: tabular-nums; }
#error { padding: 10px 13px; margin-bottom: 15px; border: 1px solid var(--error-border); border-radius: 7px; background: var(--error-bg); color: var(--error-text); }
dialog { color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 430px; max-width: 94vw; box-shadow: 0 20px 80px #0005; }
dialog::backdrop { background: #253d3355; backdrop-filter: blur(3px); }
dialog h2 { font-size: 18px; }
dialog select { display: block; margin-top: 6px; width: 100%; }
.empty { padding: 70px 20px; text-align: center; }
@media (max-width: 800px) {
  header { padding: 0 18px; }
  main { padding: 18px; }
  .layout { grid-template-columns: 1fr; }
  .details { min-height: auto; }
  .detail-placeholder { min-height: 100px; }
  .goal-heading { gap: 10px; }
}

.mode-tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.mode-tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 10px 16px; border-bottom: 2px solid transparent; }
.mode-tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.task-card { margin-bottom: 12px; }
.task-heading { display: flex; align-items: center; gap: 10px; }
.task-heading h3 { font-size: 14px; font-weight: 550; margin: 0; flex: 1; overflow-wrap: anywhere; }
.task-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; color: var(--soft-text); font-size: 11px; }
.task-note { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 12px; }
.task-card details { margin-top: 12px; color: var(--soft-text); font-size: 11px; }
.task-card pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px system-ui; }
.session-summary { padding: 2px 0 18px; }
.eyebrow { display: block; font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 9px; }
.session-summary h2 { font-size: 23px; }
.session-summary p { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 8px 0 0; }
.notice { border-left: 3px solid var(--notice-border); background: var(--notice-bg); color: var(--notice-text); padding: 10px 13px; margin-bottom: 15px; font-size: 12px; line-height: 1.7; }
.context-heading { font-size: 12px; font-weight: 500; color: var(--muted); margin: 22px 0 13px; }
.task-card.focused { border-color: var(--focus); }
.wait-context { margin-top: 17px; padding-top: 12px; border-top: 1px solid var(--border); }
.wait-context p { white-space: pre-wrap; overflow-wrap: anywhere; }
.task-history { margin: 13px 0; font-size: 12px; color: var(--soft-text); }
@media (max-width: 500px) {
  header { gap: 8px; padding: 0 12px; }
  .header-controls { gap: 4px; }
  .header-controls button { padding: 5px 6px; }
  #scopeSwitch { display: none; }
}
</style>
<header>
  <h1>Wait<small id="scopeLabel"></small></h1><a id="scopeSwitch"></a>
  <div class="header-controls">
    <button id="languageToggle" type="button" data-i18n="language.switch" data-i18n-aria-label="language.aria" aria-label="Switch language">中文</button>
    <button id="themeToggle" type="button" aria-label="Switch color theme">Dark</button>
  </div>
  <span id="connection" data-i18n="connection.connecting"></span>
</header>
<main>
  <div id="error" hidden></div>
  <section class="session-summary" aria-live="polite">
    <span class="eyebrow" data-i18n="session.tasks">Session tasks</span>
    <h2 id="sessionStatus" data-i18n="session.connecting"></h2>
    <p id="sessionNext"></p>
  </section>
  <div id="notice" class="notice" hidden></div>
  <nav id="modes" class="mode-tabs" data-i18n-aria-label="view.aria" aria-label="Task views">
    <button data-mode="session" data-i18n="mode.session"></button>
    <button data-mode="goal" data-i18n="mode.goal"></button>
    <button data-mode="wait" data-i18n="mode.wait"></button>
    <button data-mode="loop" data-i18n="mode.loop"></button>
  </nav>
  <div id="taskList" hidden></div>
  <div class="toolbar" id="goalToolbar">
    <select id="goals" data-i18n-aria-label="select.goal" aria-label="Select a goal"></select>
    <div class="spacer"></div>
    <button id="pause" data-i18n="goal.pause">Pause</button>
    <button id="resume" data-i18n="goal.resume">Resume</button>
    <button class="danger" id="cancel" data-i18n="common.cancel">Cancel</button>
  </div>
  <div id="empty" class="card empty" hidden>
    <h2 data-i18n="empty.goals.title">No goals yet</h2>
    <p class="muted" data-i18n="empty.goals.body">This session has no DAG. Create one with waitctl goal init.</p>
  </div>
  <div id="content" hidden>
    <div class="goal-heading">
      <h2 id="objective"></h2>
      <div class="stats" id="stats"></div>
    </div>
    <div class="progress"><span id="progress"></span></div>
    <div class="layout">
      <section class="card graph-card">
        <div class="graph-head">
          <b data-i18n="graph.title">Dependency graph</b>
          <button id="add" data-i18n="graph.add">+ Node</button>
        </div>
        <div class="graph" id="graph"></div>
        <div class="legend">
          <span><i class="dot pending"></i><span data-i18n="state.pending">Pending</span></span>
          <span><i class="dot running"></i><span data-i18n="state.running">Running</span></span>
          <span><i class="dot waiting"></i><span data-i18n="state.waiting">Waiting</span></span>
          <span><i class="dot completed"></i><span data-i18n="state.completed">Completed</span></span>
          <span><i class="dot failed"></i><span data-i18n="state.failed">Failed</span></span>
        </div>
      </section>
      <aside class="card details" id="details"></aside>
    </div>
    <details class="card events">
      <summary data-i18n="events.recent">Recent changes</summary>
      <div id="events"></div>
    </details>
  </div>
  <section id="independentTasks"></section>
</main>
<dialog id="addDialog">
  <form id="addForm">
    <h2 data-i18n="node.add">Add node</h2>
    <label><span data-i18n="node.id">Node ID</span><input name="id" required pattern="[a-zA-Z0-9_.-]+"></label>
    <label><span data-i18n="node.title">Task description</span><input name="title" required></label>
    <label><span data-i18n="node.kind">Type</span>
      <select name="kind">
        <option value="local" data-i18n="node.kind.local">Main agent</option>
        <option value="agent" data-i18n="node.kind.agent">Subagent</option>
        <option value="external" data-i18n="node.kind.external">External event</option>
      </select>
    </label>
    <label><span data-i18n="node.dependencies">Dependencies (comma-separated IDs)</span><input name="depends_on"></label>
    <label><span data-i18n="node.acceptance">Acceptance criteria (one per line)</span><textarea name="acceptance"></textarea></label>
    <label><span data-i18n="node.write_paths">Write paths (one per line; leave blank for read-only)</span><textarea name="write_paths"></textarea></label>
    <div class="actions">
      <button class="primary" data-i18n="common.add">Add</button>
      <button type="button" id="dismiss" data-i18n="common.back">Back</button>
    </div>
  </form>
</dialog>

        "node.write_paths": "写入路径（每行一条，留空表示只读）"
      }
    };
    let language = localStorage.getItem("wait-dashboard-language") || "en";

    function t(key, values = {}, fallback = key) {
      const text = copy[language][key] || fallback;
      return text.replace(/\{(\w+)\}/g, (placeholder, name) =>
        name in values ? String(values[name]) : placeholder);
    }

    function translate(node, key) {
      node.dataset.i18n = key;
      node.textContent = t(key);
    }

    function applyLanguage() {
      document.documentElement.lang = language === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });
      for (const attribute of ["aria-label", "title"]) {
        document.querySelectorAll(`[data-i18n-${attribute}]`).forEach(node => {
          node.setAttribute(attribute, t(node.getAttribute(`data-i18n-${attribute}`)));
        });
      }
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const target = theme === "light" ? "Dark" : "Light";
      const button = $("themeToggle");
      translate(button, `theme.${target.toLowerCase()}`);
      button.dataset.i18nAriaLabel = `theme.to${target}`;
      button.setAttribute("aria-label", t(button.dataset.i18nAriaLabel));
    }

    function formatTime(value) {
      if (!value) return "—";
      const date = new Date(typeof value === "number" ? value * 1000 : value);
      return date.toLocaleString(language === "en" ? "en-US" : "zh-CN");
    }

    $("languageToggle").onclick = () => {
      language = language === "en" ? "zh" : "en";
      localStorage.setItem("wait-dashboard-language", language);
      applyLanguage();
      onLanguageChange();
    };
    $("themeToggle").onclick = () => {
      const theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      localStorage.setItem("wait-dashboard-theme", theme);
      applyTheme(theme);
    };

    applyTheme(localStorage.getItem("wait-dashboard-theme") || "light");
    applyLanguage();
    return { t, formatTime, translate };
  }

  const scope = new URLSearchParams(location.search);
  const scopeQuery = "?" + scope.toString();
  const allSessions = scope.get("all") === "1";
  $("scopeLabel").dataset.i18n = allSessions ? "scope.all" : "scope.current";
  if (scope.get("session")) $("scopeLabel").title = scope.get("session");
  else $("scopeLabel").dataset.i18nTitle = "scope.openHint";
  $("scopeSwitch").dataset.i18n = allSessions ? "scope.current" : "scope.all";
  const otherScope = new URLSearchParams(scope);
  if (allSessions) otherScope.delete("all"); else otherScope.set("all", "1");
  $("scopeSwitch").href = "/?" + otherScope.toString();
  $("scopeSwitch").hidden = allSessions && !scope.get("session");
  let tasks = {goals: [], watches: [], loops: [], linked_watches: []};
  let mode = scope.get("mode") || "session";
  const focus = scope.get("focus") || "";
  let focusPending = !!focus;

  let selected = mode === "goal" ? focus : "";
  let nodeId = scope.get("node") || "";

  const { t, formatTime, translate } = createAppearance(() => render({preserveEditor: true}));

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function svgElement(tag, attributes) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    return node;
  }

  const colors = {
    pending: "var(--status-pending)", running: "var(--status-running)", dispatching: "var(--status-running)",
    waiting: "var(--status-waiting)", completed: "var(--status-completed)", failed: "var(--status-failed)",
    cancelled: "var(--status-failed)"
  };

  function currentGoal() {
    return tasks.goals.find(goal => goal.path === selected);
  }

  function splitValues(value, separator) {
    return value.split(separator).map(item => item.trim()).filter(Boolean);
  }

  function nodeFields(values) {
    return {
      title: values.get("title"),
      depends_on: splitValues(values.get("depends_on"), ","),
      acceptance: splitValues(values.get("acceptance"), "\n")
    };
  }

  function showError(message) {
    $("error").textContent = message;
    $("error").hidden = false;
  }

  async function act(action, fields = {}) {
    $("error").hidden = true;
    try {
      const response = await fetch("/api/action" + scopeQuery, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: selected, action, ...fields })
      });
      const result = await response.json();
      if (!response.ok) throw Error(result.error);
      const notices = {
        wait: "notice.wait",
        loop: "notice.loop",
        pause: "notice.pause",
        cancel: "notice.cancel"
      };
      translate($("notice"), notices[fields.mode] || notices[action] || "notice.saved");
      $("notice").hidden = false;
      return true;
    } catch (error) {
      showError(error.message);
      return false;
    }
  }

  function renderEvents(events) {
    $("events").replaceChildren(...events.slice(-30).reverse().map(event => {
      const row = element("div", undefined, "event");
      const name = t(`event.${event.operation}`, {}, event.operation || t("event.unknown"));
      let actor = "agent";
      if (event.source === "user") actor = "user";
      else if (event.operation === "wake_node") actor = "event";
      const parts = [t(`event.actor.${actor}`), name];
      if (event.node_id) parts.push(event.node_id);
      row.append(
        element("time", formatTime(event.at)),
        element("span", parts.join(" · "))
      );
      return row;
    }));
  }

  async function cancelTask(task, kind) {
    if (!confirm(t(kind === "wait" ? "confirm.wait" : "confirm.loop"))) return;
    await act("cancel", kind === "wait"
      ? {mode: "wait", watch_id: task.watch_id}
      : {mode: "loop", path: task.path});
  }

  function renderTaskList(collection, kind, list) {
    if (!collection.length) {
      const empty = element("div", undefined, "card empty");
      empty.append(element("h2", t(kind === "wait" ? "empty.wait" : "empty.loop")));
      list.replaceChildren(empty);
      return;
    }
    list.replaceChildren(...collection.map(task => {
      const identity = kind === "wait" ? task.watch_id : task.path;
      const card = element("article", undefined, "card task-card" + (identity === focus ? " focused" : ""));
      if (identity === focus) card.id = "focusedTask";
      if (task.error) {
        card.append(element("p", task.error));
        return card;
      }
      const state = kind === "wait" ? task.state : task.status;
      const heading = element("div", undefined, "task-heading");
      heading.append(element("h3", kind === "wait" ? task.label : task.task),
        element("span", t(`state.${state}`), "badge"));
      if (state === "active") {
        const cancel = element("button", t("common.cancel"), "danger");
        cancel.onclick = () => cancelTask(task, kind);
        heading.append(cancel);
      }
      card.append(heading);
      const meta = element("div", undefined, "task-meta");
      if (kind === "loop") {
        let phase = t(`state.${state}`);
        if (task.phase === "waiting") phase = t("field.next", {value: formatTime(task.next_run_at)});
        else if (task.phase === "running") phase = t("state.running");
        meta.append(
          element("span", t("field.iteration", {value: task.iteration + (task.max_iterations ? " / " + task.max_iterations : "")})),
          element("span", t("field.interval", {value: task.interval_seconds})),
          element("span", phase)
        );
      } else {
        meta.append(element("span", task.watch_id.slice(0, 8)),
          element("span", t("field.query", {value: task.query_status || "—"})),
          element("span", t("field.notification", {value: task.result?.notification || task.notification_channel?.status || "—"})));
      }
      meta.append(element("span", t("field.deadline", {value: formatTime(task.deadline_at)})));
      if (allSessions) meta.append(element("span", t("field.session", {value: task.session})));
      card.append(meta);
      if (task.event_note) {
        card.append(element("p", t("field.triggered", {value: task.event_note}), "task-note"));
      }
      const more = element("details");
      more.append(element("summary", t("common.details")));
      const details = kind === "wait"
        ? {result: task.result, log_file: task.log_file}
        : {path: task.path, goal: task.goal, runs: task.runs, events: task.events};
      more.append(element("pre", JSON.stringify(details, null, 2)));
      card.append(more);
      return card;
    }));
  }

  function renderSummary() {
    const validGoals = tasks.goals.filter(goal => !goal.error);
    const running = validGoals.some(goal => Object.values(goal.nodes).some(node => ["running", "dispatching"].includes(node.status))) ||
      tasks.loops.some(loop => loop.status === "active" && loop.phase === "running");
    const ready = validGoals.some(goal => goal.status === "open" && goal.activity === "ready");
    const waiting = tasks.watches.filter(watch => watch.state === "active").length +
      tasks.linked_watches.filter(watch => {
        if (watch.state !== "active") return false;
        if (watch.owner.mode === "goal") {
          const goal = validGoals.find(goal => goal.path === watch.owner.path);
          return goal?.status === "open" && goal.nodes[watch.owner.node]?.wait?.watch_id === watch.watch_id;
        }
        const loop = tasks.loops.find(loop => loop.path === watch.owner.path);
        return loop?.status === "active" && loop.watch_id === watch.watch_id;
      }).length;
    const paused = validGoals.some(goal => goal.status === "paused");
    const verification = validGoals.some(goal => goal.status === "open" && goal.activity === "awaiting_verification");
    const failed = validGoals.some(goal => Object.values(goal.nodes).some(node => node.status === "failed")) ||
      tasks.watches.some(watch => watch.state === "failed");
    const statuses = [
      [failed, "status.attention"],
      [paused, "status.paused"],
      [running, "status.running"],
      [waiting, "status.waiting"],
      [verification, "status.verification"],
      [ready, "status.ready"],
      [validGoals.length || tasks.watches.length || tasks.loops.length, "status.idle"],
      [true, "status.start"]
    ];
    const guidance = [
      [paused, "guide.paused"],
      [waiting, "guide.waiting", {count: waiting}],
      [failed, "guide.failed"],
      [verification, "guide.verification"],
      [running || ready, "guide.progress"],
      [true, "guide.idle"]
    ];
    translate($("sessionStatus"), statuses.find(([matches]) => matches)[1]);
    const [, key, values = {}] = guidance.find(([matches]) => matches);
    $("sessionNext").textContent = t(key, values);
  }

  function renderIndependent() {
    const root = $("independentTasks");
    root.replaceChildren();
    root.hidden = mode !== "session";
    if (root.hidden) return;
    const finishedGoals = tasks.goals.filter(goal => ["completed", "cancelled"].includes(goal.status));
    if (finishedGoals.length) {
      const history = element("details", undefined, "task-history");
      history.append(element("summary", t("history.goals", {count: finishedGoals.length})));
      for (const goal of finishedGoals) {
        const button = element("button", goal.objective);
        button.onclick = () => { selected = goal.path; nodeId = ""; mode = "goal"; render(); };
        history.append(button);
      }
      root.append(history);
    }
    const independent = [
      ["wait", tasks.watches],
      ["loop", tasks.loops.filter(loop => !loop.goal)]
    ];
    for (const [kind, collection] of independent) {
      const past = [];
      const active = [];
      for (const task of collection) {
        const status = kind === "wait" ? task.state : task.status;
        (task.error || status !== "active" ? past : active).push(task);
      }
      if (active.length) {
        root.append(element("h3", t(kind === "wait" ? "section.independentWaits" : "section.independentLoops"), "context-heading"));
        const list = element("div");
        renderTaskList(active, kind, list);
        root.append(list);
      }
      if (past.length) {
        const history = element("details", undefined, "task-history");
        history.append(element("summary", t(kind === "wait" ? "history.waits" : "history.loops", {count: past.length})));
        const list = element("div");
        renderTaskList(past, kind, list);
        history.append(list);
        root.append(history);
      }
    }
  }

  function render({preserveEditor = false} = {}) {
    renderSummary();
    renderIndependent();
    const counts = {session: tasks.goals.filter(goal => goal.status === "open").length +
      tasks.watches.filter(task => task.state === "active").length +
      tasks.loops.filter(task => task.status === "active" && !task.goal).length,
      goal: tasks.goals.length, wait: tasks.watches.length, loop: tasks.loops.length};
    for (const button of $("modes").querySelectorAll("button")) {
      const kind = button.dataset.mode;
      button.textContent = `${t(`mode.${kind}`)} · ${counts[kind]}`;
      button.setAttribute("aria-selected", kind === mode);
    }
    const showingGoal = ["session", "goal"].includes(mode);
    $("goalToolbar").hidden = !showingGoal || !tasks.goals.length;
    $("taskList").hidden = showingGoal;
    if (!showingGoal) {
      $("empty").hidden = true;
      $("content").hidden = true;
      renderTaskList(mode === "wait" ? tasks.watches : tasks.loops, mode, $("taskList"));
      return;
    }
    if (!currentGoal()) selected = (tasks.goals.find(goal => goal.status === "open") || tasks.goals[0])?.path || "";
    $("goals").replaceChildren(...tasks.goals.map(goal => {
      const option = element("option", goal.objective || goal.path);
      option.value = goal.path;
      return option;
    }));
    $("goals").value = selected;

    const goal = currentGoal();
    const historical = mode === "session" && goal && ["completed", "cancelled"].includes(goal.status);
    $("empty").hidden = !!goal || mode === "session";
    $("content").hidden = !goal || historical;
    $("goalToolbar").hidden = historical || !goal;
    for (const action of ["pause", "resume", "cancel"]) $(action).disabled = !goal;
    if (!goal) return;
    if (goal.error) {
      showError(goal.error);
      $("content").hidden = true;
      return;
    }

    $("objective").textContent = goal.objective;
    $("objective").title = goal.path;
    const available = {
      pause: goal.status === "open",
      resume: goal.status === "paused",
      cancel: ["open", "paused"].includes(goal.status)
    };
    for (const [action, enabled] of Object.entries(available)) {
      $(action).hidden = !enabled;
      $(action).disabled = !enabled;
    }
    $("add").disabled = goal.status !== "open";

    const nodes = Object.values(goal.nodes);
    const completed = nodes.filter(node => node.status === "completed").length;
    $("stats").replaceChildren(
      element("span", t(`state.${goal.status}`), "badge"),
      element("span", t("field.completeCount", {done: completed, total: nodes.length}))
    );
    $("progress").style.width = (nodes.length ? completed / nodes.length * 100 : 0) + "%";
    draw(goal);
    if (!$("details").contains(document.activeElement)) {
      renderDetails(goal, preserveEditor ? $("details").querySelector("form") : null);
    } else {
      const heading = $("details").querySelector("h3");
      if (heading && goal.nodes[nodeId]) heading.textContent = goal.nodes[nodeId].title;
    }
    renderEvents(goal.events);
  }

  function layout(nodes, width) {
    const positions = {};
    const layers = {};
    const vertical = width < 600;

    function place(id) {
      if (positions[id]) return positions[id].level;
      const dependencies = nodes[id].depends_on;
      const level = dependencies.length ? Math.max(...dependencies.map(place)) + 1 : 0;
      const row = layers[level] || 0;
      layers[level] = row + 1;
      positions[id] = {
        level,
        x: vertical ? Math.max(24, (width - 200) / 2) + row * 225 : 24 + level * 245,
        y: vertical ? 26 + level * 105 : 26 + row * 110
      };
      return level;
    }

    Object.keys(nodes).forEach(place);
    return { positions, vertical };
  }

  function edgePath(from, to, vertical) {
    if (vertical) {
      return `M${from.x + 100} ${from.y + 76} C${from.x + 100} ${from.y + 92} ${to.x + 100} ${to.y - 16} ${to.x + 100} ${to.y}`;
    }
    return `M${from.x + 200} ${from.y + 36} C${from.x + 225} ${from.y + 36} ${to.x - 25} ${to.y + 36} ${to.x} ${to.y + 36}`;
  }

  function drawNode(id, node, position) {
    const selectedNode = id === nodeId;
    const group = svgElement("g", {
      transform: `translate(${position.x},${position.y})`,
      tabindex: 0, role: "button", "aria-label": node.title
    });
    group.append(
      svgElement("rect", {
        width: 200, height: 76, rx: 10,
        fill: selectedNode ? "var(--node-selected)" : "var(--node)",
        stroke: selectedNode ? "var(--node-selected-border)" : "var(--node-border)",
        "stroke-width": selectedNode ? 2 : 1
      }),
      svgElement("rect", { x: 0, y: 12, width: 4, height: 52, rx: 2, fill: colors[node.status] })
    );
    const title = svgElement("text", { x: 15, y: 26 });
    title.textContent = node.title.length > 13 ? node.title.slice(0, 13) + "…" : node.title;
    const status = svgElement("text", { x: 15, y: 52, class: "small" });
    status.textContent = id + " · " + t(`state.${node.status}`);
    const tooltip = svgElement("title", {});
    tooltip.textContent = node.title;
    group.append(title, status, tooltip);

    function select() {
      nodeId = id;
      const goal = currentGoal();
      draw(goal);
      if (!$("details").contains(document.activeElement)) renderDetails(goal);
    }
    group.onclick = select;
    group.onkeydown = event => {
      if (event.key === "Enter") select();
    };
    return group;
  }

  function draw(goal) {
    const { positions, vertical } = layout(goal.nodes, $("graph").clientWidth);
    const svg = svgElement("svg", {
      width: Math.max(vertical ? 260 : 650, ...Object.values(positions).map(point => point.x + 230)),
      height: Math.max(270, ...Object.values(positions).map(point => point.y + 100))
    });
    const definitions = svgElement("defs", {});
    const marker = svgElement("marker", {
      id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"
    });
    marker.append(svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "var(--edge)" }));
    definitions.append(marker);
    svg.append(definitions);

    for (const [id, node] of Object.entries(goal.nodes)) {
      for (const dependency of node.depends_on) {
        svg.append(svgElement("path", {
          d: edgePath(positions[dependency], positions[id], vertical),
          fill: "none", stroke: "var(--edge)", "stroke-width": 1.5, "marker-end": "url(#arrow)"
        }));
      }
    }
    for (const [id, node] of Object.entries(goal.nodes)) {
      svg.append(drawNode(id, node, positions[id]));
    }
    $("graph").replaceChildren(svg);
  }

  function editForm(node) {
    const form = element("form");
    const fields = [
      ["title", "node.title", node.title],
      ["depends_on", "node.dependencies", node.depends_on.join(", ")],
      ["acceptance", "node.acceptance", node.acceptance.join("\n")]
    ];
    for (const [name, labelKey, value] of fields) {
      const field = element("label");
      const label = element("span");
      translate(label, labelKey);
      const input = element(name === "acceptance" ? "textarea" : "input");
      input.name = name;
      input.value = value;
      input.required = name === "title";
      field.append(label, input);
      form.append(field);
    }
    const save = element("button", undefined, "primary");
    translate(save, "common.edit");
    save.style.marginTop = "16px";
    form.append(save);
    form.onsubmit = async event => {
      event.preventDefault();
      await act("edit", { id: nodeId, ...nodeFields(new FormData(form)) });
    };
    return form;
  }

  function renderDetails(goal, editor = null) {
    const box = $("details");
    box.replaceChildren();
    const node = goal.nodes[nodeId];
    if (!node) {
      const placeholder = element("div", undefined, "detail-placeholder");
      placeholder.append(element("div", "⌘", "symbol"), element("p", t("field.selectNode")));
      box.append(placeholder);
      return;
    }
    const kind = t(`field.nodeKind.${node.kind}`);
    box.append(
      element("span", t(`state.${node.status}`), "badge"),
      element("h3", node.title),
      element("p", nodeId + " · " + kind, "muted")
    );
    if (node.status === "pending" && goal.status === "open") {
      box.append(editor || editForm(node));
    } else {
      const acceptance = element("ul");
      acceptance.append(...node.acceptance.map(item => element("li", item)));
      box.append(
        element("p", t("field.dependencies", {value: node.depends_on.join(t("list.separator")) || t("field.noDependencies")})),
        element("b", t("field.acceptance")), acceptance
      );
    }
    const relatedLoops = tasks.loops.filter(loop => loop.goal?.state === goal.path && loop.goal?.node === nodeId);
    const waits = tasks.linked_watches.filter(watch =>
      watch.owner.mode === "goal" && watch.owner.path === goal.path && watch.owner.node === nodeId);
    if (node.wait || relatedLoops.length || waits.length) {
      const context = element("section", undefined, "wait-context");
      context.append(element("b", t("field.waitLoop")));
      if (node.wait) {
        context.append(element("p", node.wait.label || t("field.externalCondition"), "task-note"));
        if (node.wait.event_note) context.append(element("p", t("field.triggered", {value: node.wait.event_note}), "task-note"));
      }
      for (const wait of waits) {
        context.append(element("p", `${t(`state.${wait.state}`)} · ${t("field.deadline", {value: formatTime(wait.deadline_at)})}`, "muted"));
      }
      for (const loop of relatedLoops) {
        context.append(element("p", t("field.loopState", {task: loop.task, iteration: loop.iteration, status: t(`state.${loop.status}`)}), "task-note"));
        if (loop.event_note) context.append(element("p", t("field.loopNext", {value: loop.event_note}), "task-note"));
      }
      box.append(context);
    }
    if (node.result) {
      box.append(element("h4", t("field.result")),
        element("p", typeof node.result === "string" ? node.result : node.result.summary || JSON.stringify(node.result), "task-note"));
    }
    if (node.wait) {
      const metadata = element("details", undefined, "muted");
      metadata.append(element("summary", t("field.waitDetails")), element("pre", JSON.stringify(node.wait, null, 2)));
      box.append(metadata);
    }
    if (node.status === "failed" && goal.status === "open") {
      const retry = element("button", t("common.retry"));
      retry.onclick = () => act("retry", { id: nodeId });
      box.append(retry);
    }
  }

  $("goals").onchange = event => {
    selected = event.target.value;
    nodeId = "";
    render();
  };
  $("pause").onclick = () => act("pause");
  $("resume").onclick = () => act("resume");
  $("cancel").onclick = () => {
    if (confirm(t("confirm.goal"))) act("cancel");
  };
  $("add").onclick = () => $("addDialog").showModal();
  $("dismiss").onclick = () => $("addDialog").close();
  $("addForm").onsubmit = async event => {
    event.preventDefault();
    const form = event.target;
    const values = new FormData(form);
    const writes = splitValues(values.get("write_paths"), "\n");
    const added = await act("add", {
      id: values.get("id"), kind: values.get("kind"), ...nodeFields(values),
      read_only: !writes.length, write_paths: writes
    });
    if (added) {
      $("addDialog").close();
      form.reset();
    }
  };

  $("modes").onclick = event => {
    const button = event.target.closest("button[data-mode]");
    if (button) { mode = button.dataset.mode; render(); }
  };

  new ResizeObserver(() => {
    const goal = currentGoal();
    if (goal && !goal.error) draw(goal);
  }).observe($("graph"));

  const stream = new EventSource("/events" + scopeQuery);
  stream.onmessage = event => {
    tasks = JSON.parse(event.data);
    translate($("connection"), "connection.live");
    render();
    if (focusPending) {
      document.getElementById("focusedTask")?.scrollIntoView({block: "center", behavior: "smooth"});
      focusPending = false;
    }
  };
  stream.onerror = () => translate($("connection"), "connection.reconnecting");
})();
</script></html>
